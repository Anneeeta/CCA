[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooperative-cognitive-agents"
version = "0.1.0"
description = "A role-specialized multi-agent system for iterative topic exploration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anneeeta" }]
dependencies = [
  "openai>=1.12.0",
  "tenacity>=8.2.3",
  "pydantic>=2.6.1",
  "pydantic-settings>=2.2.1",
  "PyYAML>=6.0.1",
  "scikit-learn>=1.3.2",
  "numpy>=1.26.4",
  "sentence-transformers>=2.2.2",
  "ddgs>=9.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
cca = "cca_cli:main"

[tool.setuptools]
py-modules = ["cca_cli", "main"]

[tool.setuptools.packages.find]
include = ["cca*"]

[tool.ruff]
line-length = 100
target-version = "py310"
